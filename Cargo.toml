[package]
name = "ratty"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
anyhow = "1.0"
gix = "0.72"
toml = { version = "0.8", features = ["parse"] }
serde = { version = "1.0", features = ["derive"] }
directories = "6.0"
imara-diff = "0.1"
